<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conectar | MeuChopp</title>
  <link href="../renderer/vendor/bootstrap-lite.css" rel="stylesheet">
  <link href="../renderer/css/style.css" rel="stylesheet">
  <link href="../renderer/css/app.css" rel="stylesheet">
</head>
<body>
  <main class="form-panel" style="min-height:100vh">
    <div class="login-card">
      <div class="brand-logo" style="margin-bottom:1.5rem;color:var(--mc-text)">
        <img src="../renderer/assets/icon-64.png" width="40" height="40" alt="">
        <span class="brand-name">MeuChopp</span>
      </div>
      <h1>Conectar ao servidor</h1>
      <p class="login-subtitle">Informe o endereço do servidor do MeuChopp. Peça ao administrador se não souber.</p>
      <div id="formAlert" class="alert d-none" role="alert"></div>
      <form id="connectForm" novalidate>
        <div class="mb-3">
          <label for="url" class="form-label">Endereço do servidor</label>
          <input id="url" class="form-control" type="text" placeholder="https://chopp.suaempresa.com.br" autocomplete="off" autofocus>
        </div>
        <label class="check-item mb-4" for="kiosk"><input id="kiosk" type="checkbox"><span>Abrir em tela cheia (modo quiosque)</span></label>
        <button id="submitBtn" type="submit" class="btn btn-mc w-100">Conectar</button>
      </form>
      <p class="demo-note">Dica: dentro do app, aperte <strong>Alt</strong> para abrir o menu e escolher <strong>Alterar servidor</strong>; <strong>F11</strong> alterna a tela cheia.</p>
    </div>
  </main>
  <script src="connect.js"></script>
</body>
</html>
