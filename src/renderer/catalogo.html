<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16181d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="icon" href="assets/icone-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/icone.svg" type="image/svg+xml">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Chopes e estilos | BarrilFacil</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link href="vendor/bootstrap-lite.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/dashboard.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <header id="appHeader" class="app-header"></header>
  <main class="dashboard-main">
    <div class="page-head">
      <div><h1>Chopes e estilos</h1><p id="subtitle">Catálogo usado no cadastro de barris. Renomear um chope ou estilo atualiza também os barris dele.</p></div>
    </div>

    <section class="panel">
      <h2 class="panel-title">Novo chope</h2>
      <form id="formChope" class="row g-3 align-items-end" novalidate>
        <div class="col-md-5"><label class="form-label" for="chopeNome">Nome do chope</label><input id="chopeNome" class="form-control" placeholder="Ex.: German Pilsen" maxlength="60" required></div>
        <div class="col-md-4"><label class="form-label" for="chopeEstilo">Estilo</label><select id="chopeEstilo" class="form-select" required></select></div>
        <div class="col-md-3"><button class="btn btn-mc btn-mc-sm w-100" type="submit">Cadastrar chope</button></div>
      </form>
    </section>

    <h2 class="section-title">Chopes</h2>
    <div class="table-card mb-section">
      <table>
        <thead><tr><th>Chope</th><th>Estilo</th><th class="admin-only">Situação</th><th class="admin-only"></th></tr></thead>
        <tbody id="tbodyChopes"></tbody>
      </table>
    </div>

    <section class="panel">
      <h2 class="panel-title">Novo estilo</h2>
      <form id="formEstilo" class="row g-3 align-items-end" novalidate>
        <div class="col-md-5"><label class="form-label" for="estiloNome">Nome do estilo</label><input id="estiloNome" class="form-control" placeholder="Ex.: Pilsen" maxlength="60" required></div>
        <div class="col-md-3"><button class="btn btn-mc btn-mc-sm w-100" type="submit">Cadastrar estilo</button></div>
      </form>
    </section>

    <h2 class="section-title">Estilos</h2>
    <div class="table-card">
      <table>
        <thead><tr><th>Estilo</th><th class="admin-only">Situação</th><th class="admin-only"></th></tr></thead>
        <tbody id="tbodyEstilos"></tbody>
      </table>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/catalogo.js"></script>
</body>
</html>
