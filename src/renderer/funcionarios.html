<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16181d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="icon" href="assets/icone-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/icone.svg" type="image/svg+xml">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Funcionários | BarrilFacil</title>
  <link href="vendor/bootstrap-lite.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/dashboard.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
  <link href="css/tema-escuro.css" rel="stylesheet">
  <script src="js/tema.js"></script>
</head>
<body>
  <header id="appHeader" class="app-header"></header>
  <main class="dashboard-main">
    <div class="page-head">
      <div><h1>Funcionários</h1><p id="subtitle">Quem trabalha em cada unidade. No celular do quiosque, a pessoa toca no próprio nome antes de salvar cada ação.</p></div>
    </div>

    <section class="panel">
      <h2 class="panel-title">Novo funcionário</h2>
      <form id="formFunc" class="row g-3 align-items-end" novalidate>
        <div class="col-md-6"><label class="form-label" for="nome">Nome</label>
          <input id="nome" class="form-control" maxlength="60" autocomplete="off" placeholder="Ex.: Maria Souza" aria-describedby="nomeAjuda" required>
          <div id="nomeAjuda" class="form-hint">É o nome que aparece no botão. Se houver duas pessoas com o mesmo nome, use o sobrenome.</div></div>
        <div class="col-12"><div class="form-label">Unidades onde trabalha</div><div id="unidades" class="check-list"></div></div>
        <div class="col-12"><button class="btn btn-mc btn-mc-sm" type="submit">Cadastrar funcionário</button></div>
      </form>
    </section>

    <div class="table-card">
      <table>
        <thead><tr><th>Nome</th><th>Unidades</th><th>Situação</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/funcionarios.js"></script>
</body>
</html>
