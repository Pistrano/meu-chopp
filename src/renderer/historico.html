<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16181d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="icon" href="assets/icone-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/icone.svg" type="image/svg+xml">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Histórico | BarrilFacil</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link href="vendor/bootstrap-lite.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/dashboard.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <header id="appHeader" class="app-header"></header>
  <main class="dashboard-main">
    <div class="page-head">
      <div><h1>Histórico</h1><p id="subtitle">Quem fez cada operação, com data e hora.</p></div>
      <button id="btnExport" class="btn btn-mc btn-mc-sm" type="button">Exportar relatório (CSV)</button>
    </div>

    <div id="tabs" class="tabs d-none">
      <button type="button" class="active" data-tab="mov">Movimentações</button>
      <button type="button" data-tab="aud">Auditoria do sistema</button>
    </div>

    <section id="tabMov">
      <div class="filters">
        <input id="q" class="form-control" type="search" placeholder="Buscar pelo código do barril">
        <select id="operacao" class="form-select">
          <option value="">Todas as operações</option><option value="entrada">Entrada</option>
          <option value="transferencia">Transferência</option><option value="utilizacao">Utilização</option><option value="esgotado">Chopp Esgotado</option>
        </select>
      </div>
      <div class="table-card">
        <table>
          <thead><tr><th>Data</th><th>Barril</th><th>Operação</th><th>Rota</th><th>Torneira</th><th>Responsável</th><th>Observação</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <section id="tabAud" class="d-none">
      <div class="table-card">
        <table>
          <thead><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Detalhe</th></tr></thead>
          <tbody id="tbodyAud"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/historico.js"></script>
</body>
</html>
