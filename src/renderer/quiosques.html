<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiosques | MeuChopp</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link href="vendor/bootstrap-lite.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/dashboard.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <header id="appHeader" class="app-header"></header>
  <main class="dashboard-main">
    <div class="page-head">
      <div><h1>Quiosques</h1><p>Cada quiosque tem estoque, histórico e equipe próprios. Quem não foi liberado não vê nada dele.</p></div>
    </div>

    <section class="panel">
      <h2 class="panel-title">Novo quiosque</h2>
      <form id="formUnit" class="row g-3 align-items-end" novalidate>
        <div class="col-md-5"><label class="form-label" for="nome">Nome completo</label><input id="nome" class="form-control" placeholder="Ex.: Louvada Shopping" required></div>
        <div class="col-md-4"><label class="form-label" for="curto">Nome curto</label><input id="curto" class="form-control" placeholder="Ex.: Shopping"></div>
        <div class="col-md-3"><button class="btn btn-mc btn-mc-sm w-100" type="submit">Cadastrar quiosque</button></div>
      </form>
    </section>

    <div class="table-card">
      <table>
        <thead><tr><th>Quiosque</th><th>Barris</th><th>Pessoas com acesso</th><th>Situação</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>

  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/quiosques.js"></script>
</body>
</html>
