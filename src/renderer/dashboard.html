<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16181d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Dashboard | MeuChopp</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link href="vendor/bootstrap-lite.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/dashboard.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <header id="appHeader" class="app-header"></header>
  <main class="dashboard-main">
    <section class="greeting">
      <h1 id="greetingTitle">Olá</h1>
      <p id="greetingText">Confira o resumo da operação da sua unidade.</p>
    </section>

    <section id="statsGrid" class="row row-cols-2 row-cols-md-3 row-cols-xl-5 g-3" aria-label="Indicadores da unidade"></section>

    <section>
      <h2 class="section-title">Movimentações Recentes</h2>
      <div id="movementList" class="movement-list" aria-live="polite"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
