<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuários | MeuChopp</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link href="vendor/bootstrap-lite.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/dashboard.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <header id="appHeader" class="app-header"></header>
  <main class="dashboard-main">
    <div class="page-head">
      <div><h1>Usuários</h1><p>Quem tem acesso ao sistema e a quais quiosques cada pessoa pode acessar.</p></div>
    </div>

    <section class="panel">
      <h2 class="panel-title">Novo usuário</h2>
      <form id="formUser" class="row g-3 align-items-end" novalidate>
        <div class="col-md-4"><label class="form-label" for="nome">Nome</label><input id="nome" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label" for="email">E-mail</label><input id="email" class="form-control" type="text" inputmode="email" autocomplete="off" placeholder="pessoa@empresa.com" required></div>
        <div class="col-md-4"><label class="form-label" for="cargo">Cargo</label>
          <select id="cargo" class="form-select"><option value="operador">Operador (só os quiosques liberados)</option><option value="admin">Administrador (todos os quiosques)</option></select></div>
        <div class="col-12" id="unitsBox"><div class="form-label">Quiosques que esta pessoa pode acessar</div><div id="unidades" class="check-list"></div></div>
        <div class="col-12"><button class="btn btn-mc btn-mc-sm" type="submit">Criar usuário</button>
          <span class="t-muted ms-2">O sistema gera uma senha temporária para você repassar.</span></div>
      </form>
    </section>

    <div class="table-card">
      <table>
        <thead><tr><th>Nome</th><th>E-mail</th><th>Cargo</th><th>Quiosques</th><th>Situação</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>

  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
