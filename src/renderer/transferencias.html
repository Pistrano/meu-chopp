<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16181d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="icon" href="assets/icone-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/icone.svg" type="image/svg+xml">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Transferências | BarrilFacil</title>
  <link href="vendor/bootstrap-lite.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/dashboard.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
  <link href="css/tema-escuro.css" rel="stylesheet">
  <script src="js/tema.js"></script>
</head>
<body>
  <header id="appHeader" class="app-header"></header>
  <main class="dashboard-main">
    <div class="page-head">
      <div><h1>Transferências</h1><p id="subtitle">Envie barris para outra unidade e confirme os recebimentos.</p></div>
    </div>

    <section class="panel">
      <h2 class="panel-title">Enviar barris</h2>
      <p class="panel-note">Leia a etiqueta de cada barril que vai sair (câmera ou pistola) ou escolha da lista. Depois escolha o destino e envie todos juntos.</p>
      <div class="envio">
        <div class="envio-leitor" id="leitorEnvio"></div>
        <div class="envio-grupo">
          <div class="envio-grupo-head"><span class="t-strong">Barris para enviar</span><span class="envio-contador" id="contador" aria-live="polite">0 barris</span></div>
          <div class="envio-lista" id="listaEnvio"></div>
          <button type="button" class="btn-ghost envio-da-lista" id="btnDaLista">Escolher da lista</button>
          <label class="form-label" for="destino">Enviar para</label>
          <select id="destino" class="form-select"></select>
          <button type="button" class="btn btn-mc envio-enviar" id="btnEnviar" disabled>Enviar barris</button>
        </div>
      </div>
    </section>

    <div class="table-card">
      <table>
        <thead><tr><th>Barril</th><th>Rota</th><th>Enviado por</th><th>Data</th><th>Status</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/leitor-codigo.js"></script>
  <script src="js/transferencias.js"></script>
</body>
</html>
